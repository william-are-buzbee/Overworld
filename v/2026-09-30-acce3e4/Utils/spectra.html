<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectra</title>
<style>
  :root { --bg: #16130f; --fg: #e8e2d6; --dim: #9a917f; --line: #3a342b; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: var(--dim); margin: 0 0 12px; max-width: 70ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  select { background: #221d17; color: var(--fg); border: 1px solid var(--line); padding: 4px 6px; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; }
  th, td { padding: 2px 4px; text-align: left; white-space: nowrap; }
  th { color: var(--dim); font-weight: normal; font-size: 12px; }
  td.name { color: var(--dim); font-size: 12px; padding-right: 10px; cursor: pointer; }
  tr.sel td.name { color: var(--fg); }
  .sw { width: 64px; height: 26px; border-radius: 3px; }
  canvas { background: #0f0d0a; border: 1px solid var(--line); margin-top: 16px; max-width: 100%; }
  .legend { font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<h1>Spectra</h1>
<p>Each surface as each species' eye draws it, from <code>js/spectra.js</code>: reflectance × light × receptors → screen.
The first column is the reference: a human under Earth's noon sun. Click a surface to plot its spectrum.
Each species' eyes are read from its body map (Notes/Spectral-Color-Design.md).</p>
<div class="controls">
  <label>Light <select id="light"></select></label>
  <label>Eye adapted to <select id="adapt"><option value="same">the same light</option><option value="noon">open noon</option></select></label>
  <label>Plot eye <select id="ploteye"></select></label>
</div>
<div class="wrap"><table id="grid"></table></div>
<canvas id="plot" width="720" height="260"></canvas>
<div class="legend" id="legend"></div>
<script type="module">
import * as S from '../js/spectra.js';
import { BODY_MAPS, getEye } from '../js/body-maps.js';

const surf = [
  ['photosynthetic tissue', S.reflectance(S.namedMaterial('photosynthetic_tissue'))],
  ['dead organic', S.reflectance(S.namedMaterial('dead_organic'))],
  ['hemolymph', S.reflectance(S.namedMaterial('hemolymph'))],
  ['calcium structure', S.reflectance(S.namedMaterial('calcium_structure'))],
];
for (const kind of Object.keys(S.MATRICES))
  for (const [label, m] of [['plain', {}], ['iron', { iron: 1 }], ['copper', { copper: 1 }], ['manganese', { manganese: 1 }]])
    surf.push([`${kind}, ${label}`, S.reflectance(S.mineralMaterial(kind, m))]);
surf.push(['soil, iron, soaked', S.reflectance(S.wet(S.mineralMaterial('soil', { iron: 1 }), 1))]);
surf.push(['water 0.5 m over iron sand', S.waterColumn(S.reflectance(S.mineralMaterial('sand', { iron: 1 })), 0.5)]);
surf.push(['deep water', S.waterColumn(S.flat(0.1), 100)]);
surf.push(['grey 30%', S.flat(0.3)]);

const noon = S.daylight(60);
const lights = {
  'noon (star 60°)': S.total(noon),
  'low star (15°)': S.total(S.daylight(15)),
  'star on horizon': S.total(S.daylight(0)),
  'dusk (−4°)': S.total(S.daylight(-4)),
  'night (no moon)': S.total(S.daylight(-30)),
  'forest floor': S.underCanopy(noon, S.namedMaterial('photosynthetic_tissue'), 0.15),
  'rock shadow': S.inShadow(noon),
};
const SPECIES = { prowler: 'wolf', ravager: 'dire_wolf', grazer: 'hare', shaleback: 'cave_crab', lurker: 'ambush_pred' };
const headEye = key => BODY_MAPS[key].map(getEye).filter(Boolean).sort((a, b) => b.acuity - a.acuity)[0];
const eyes = { human: S.HUMAN_EYE, ...Object.fromEntries(Object.entries(SPECIES).map(([n, k]) => [n, headEye(k)])) };
const optics = Object.fromEntries(Object.entries(eyes).map(([k, e]) => [k, S.eyeOptics(e)]));

const $ = id => document.getElementById(id);
for (const k of Object.keys(lights)) $('light').add(new Option(k, k));
for (const k of Object.keys(eyes)) $('ploteye').add(new Option(k, k));
let selected = 0;

function render() {
  const L = lights[$('light').value];
  const A = $('adapt').value === 'noon' ? lights['noon (star 60°)'] : L;
  const g = $('grid');
  g.innerHTML = '';
  const head = g.insertRow();
  head.innerHTML = '<th></th><th>reference</th>' + Object.entries(eyes).map(([k, e]) =>
    `<th>${k}<br>${e.cones.map(r => r.lambdaMax).join('/')}</th>`).join('');
  surf.forEach(([name, R], i) => {
    const tr = g.insertRow();
    if (i === selected) tr.className = 'sel';
    const td = tr.insertCell(); td.className = 'name'; td.textContent = name;
    td.onclick = () => { selected = i; render(); };
    const cells = [S.referenceColor(R), ...Object.keys(eyes).map(k => S.screenColor(optics[k], R, L, A))];
    for (const c of cells) {
      const h = S.hex(c);
      tr.insertCell().innerHTML = `<div class="sw" title="${h}" style="background:${h}"></div>`;
    }
  });
  plot(surf[selected], L, eyes[$('ploteye').value]);
}

function plot([name, R], light, eye) {
  const c = $('plot'), x = c.getContext('2d'), W = c.width, H = c.height, pad = 28;
  x.clearRect(0, 0, W, H);
  const px = l => pad + (l - S.WL_MIN) / (S.WL_MAX - S.WL_MIN) * (W - 2 * pad);
  const py = v => H - pad - v * (H - 2 * pad);
  x.strokeStyle = '#3a342b'; x.fillStyle = '#9a917f'; x.font = '11px system-ui';
  for (let l = 300; l <= 800; l += 100) { x.beginPath(); x.moveTo(px(l), pad); x.lineTo(px(l), H - pad); x.stroke(); x.fillText(l + ' nm', px(l) - 16, H - 10); }
  const line = (arr, col, width = 1.5) => {
    x.strokeStyle = col; x.lineWidth = width; x.beginPath();
    arr.forEach((v, i) => { const X = px(S.WL[i]), Y = py(Math.min(1, v)); i ? x.lineTo(X, Y) : x.moveTo(X, Y); });
    x.stroke(); x.lineWidth = 1;
  };
  const maxL = Math.max(...light);
  line(light.map(v => v / maxL), '#6b6254', 1);
  const o = S.eyeOptics(eye);
  const cols = ['#9b7bd6', '#5b9bd6', '#6fc27a', '#e0b050', '#e07060'];
  o.classes.forEach((cl, i) => line(cl.sens, cols[Math.min(cols.length - 1, i + (5 - o.classes.length))], 1));
  if (o.rods) { x.setLineDash([4, 3]); line(o.rods.sens, '#c8c8c8', 1); x.setLineDash([]); }
  line(R, S.hex(S.referenceColor(R)) === '#000000' ? '#fff' : '#f2ede4', 2.5);
  $('legend').textContent = `${name}: reflectance (bold), light (grey, scaled to its peak), cone classes of the plotted eye (thin), its rods (dashed).`;
}

$('light').onchange = $('adapt').onchange = $('ploteye').onchange = render;
render();
</script>
</body>
</html>

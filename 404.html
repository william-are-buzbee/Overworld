<title>Moved</title>
<script>
// This game moved on 7 Nov 2026. Every address under /Overworld/ goes to the same place under https://william-are-buzbee.github.io/Game-Template-and-Library/games/overworld/, its query and hash kept.
(function(){
  var old='/Overworld/'.toLowerCase(),p=location.pathname,i=p.toLowerCase().indexOf(old);
  var rest=i>=0?p.slice(i+old.length):'';
  if(rest==='index.html')rest='';
  location.replace('https://william-are-buzbee.github.io/Game-Template-and-Library/games/overworld/'+rest+location.search+location.hash);
})();
</script>

# check.yml — the automated check on every pull request and on main. Nothing here is a repo dependency:
# tools/check-modules.mjs uses only node built-ins; the smoke test's browser is installed inside the job.
#   check-modules: every js/*.js parses as an ES module and every named import resolves.
#   smoke:         boots the game headless, starts a new game, moves, saves, reloads, resumes, and
#                  checks that the same ?seed= gives the same world. Any page error fails it.
# Run locally: node tools/check-modules.mjs, and (with playwright installed) node tools/smoke.mjs
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: modules parse and imports resolve
        run: node tools/check-modules.mjs
      - name: install headless chromium (job only, not the repo)
        run: |
          npm i -g playwright@1.56.1
          npx playwright@1.56.1 install --with-deps chromium
      - name: smoke test
        run: PLAYWRIGHT_MODULE="$(npm root -g)/playwright" node tools/smoke.mjs
